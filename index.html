<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora - اتصل بنا</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <!-- عنصر طبقة الخلفية -->
  <div class="bg-overlay"></div>

  <div class="container">
    <div class="contact-card">
      <div class="header">
        <img src="logo.jpg" alt="شعار نكسورا" class="logo">
        <h1>اتصل بنا</h1>
        <p>نحن هنا لمساعدتك والتواصل معك بكل حب</p>
      </div>

      <form id="contactForm">
        <div class="form-group">
          <i class="fas fa-user icon"></i>
          <input type="text" id="name" required placeholder="الاسم الكامل">
        </div>

        <div class="form-group">
          <i class="fas fa-envelope icon"></i>
          <input type="email" id="email" required placeholder="البريد الإلكتروني">
        </div>

        <div class="form-group">
          <i class="fas fa-comment icon"></i>
          <textarea id="message" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-paper-plane"></i> إرسال الرسالة
        </button>
      </form>

      <div class="social-links">
        <p>أو تواصل معنا عبر منصات التواصل:</p>
        <div class="icons">
          <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
